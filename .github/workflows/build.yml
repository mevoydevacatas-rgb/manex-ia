name: Construir MANEX IA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir el proyecto
        run: unzip -q MANEXIA.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Crear la app (APK)
        run: gradle -p MANEXIA assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: MANEX-IA-apk
          path: MANEXIA/app/build/outputs/apk/debug/app-debug.apk
